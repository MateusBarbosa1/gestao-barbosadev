<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbosa Dev — Gestão Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <img src="logo.png" alt="Barbosa Dev" class="login-logo">
      <p class="login-sub">Gestão Comercial</p>
      <label>Usuário<input name="username" autocomplete="username" required autofocus></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error"></p>
      <button class="btn primary block" type="submit">Entrar</button>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand"><img src="logo.png" alt="Barbosa Dev" class="brand-logo"><span class="role" id="role-label"></span></div>
      <div class="top-actions">
        <label class="month">Período
          <input type="month" id="month">
        </label>
        <button class="btn ghost" id="btn-all-time" title="Mostrar todo o período">Tudo</button>
        <span class="who" id="who"></span>
        <button class="btn ghost" id="btn-password">Senha</button>
        <button class="btn ghost" id="btn-logout">Sair</button>
      </div>
    </header>
    <main id="main"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
